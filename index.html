<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registro de presença</title>
<style>
:root{--bg:#f3f6f7;--card:#fff;--ink:#14232b;--mute:#5b6b73;--line:#d5dee2;--acc:#0b6e80;--ok:#217a3c;--err:#b42323;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0f1a1f;--card:#17252c;--ink:#e8f0f3;--mute:#9db0b8;--line:#2a3d46;--acc:#4cc2d6;--ok:#5fd07f;--err:#ff8a8a;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:grid;place-items:center;padding:16px}
main{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px}
h1{font-size:1.4rem;margin:0 0 4px}
.sub{color:var(--mute);margin:0 0 20px}
label{display:block;font-weight:600;margin:14px 0 6px}
input{width:100%;font:inherit;padding:12px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit}
input:focus-visible,button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
button{width:100%;margin-top:22px;padding:14px;font:inherit;font-weight:700;border:0;border-radius:8px;background:var(--acc);color:#fff;cursor:pointer}
@media (prefers-color-scheme:dark){button{color:#06222a}}
button:disabled{opacity:.6;cursor:wait}
.msg{margin-top:18px;padding:14px;border-radius:8px;border:1px solid var(--line);display:none}
.msg.ok{display:block;border-color:var(--ok);color:var(--ok)}
.msg.err{display:block;border-color:var(--err);color:var(--err)}
.msg.info{display:block;color:var(--mute)}
.msg strong{display:block;font-size:1.05rem}
.hint{font-size:.85rem;color:var(--mute);margin-top:16px}
#cod{display:none}
</style>
</head>
<body>
<main>
  <h1 id="evento">Registro de presença</h1>
  <p class="sub" id="status">Carregando…</p>

  <label for="nome">Nome completo</label>
  <input id="nome" autocomplete="name" maxlength="120">

  <label for="mat">Matrícula</label>
  <input id="mat" inputmode="numeric" autocomplete="off" maxlength="30">

  <div id="cod">
    <label for="codigo">Código da aula</label>
    <input id="codigo" autocomplete="off" maxlength="20">
  </div>

  <button id="btn">Registrar presença</button>
  <div id="msg" class="msg" role="status" aria-live="polite"></div>
  <p class="hint">Ao registrar, o navegador pedirá permissão de localização. Ative o GPS do celular e use este link no local da aula.</p>
</main>

<script>
// 1) Cole aqui a URL do app da web (Apps Script > Implantar > Nova implantação > App da Web)
const API_URL = 'COLE_AQUI_A_URL_DO_APPS_SCRIPT';

const $ = id => document.getElementById(id);
const msg = (cls, html) => { const m = $('msg'); m.className = 'msg ' + cls; m.innerHTML = html; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function deviceId() {
  try {
    let id = localStorage.getItem('dev_id');
    if (!id) { id = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(36).slice(2)); localStorage.setItem('dev_id', id); }
    return id;
  } catch (e) { return ''; }
}

function getPos() {
  return new Promise((res, rej) => {
    if (!navigator.geolocation) return rej(new Error('Este navegador não oferece localização.'));
    navigator.geolocation.getCurrentPosition(res, e => {
      const t = {1:'Permissão de localização negada. Ative-a nas configurações do navegador e tente de novo.',
                 2:'Não foi possível obter sua localização. Ative o GPS.',
                 3:'Tempo esgotado ao obter a localização. Tente em local aberto.'};
      rej(new Error(t[e.code] || 'Falha ao obter localização.'));
    }, { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 });
  });
}

async function init() {
  try {
    const r = await fetch(API_URL);
    const c = await r.json();
    $('evento').textContent = c.evento;
    $('status').textContent = c.aberto ? 'Registro aberto.' : 'Registro fechado neste horário.';
    if (c.exigeCodigo) $('cod').style.display = 'block';
  } catch (e) {
    $('status').textContent = 'Não foi possível conectar ao servidor.';
  }
}

$('btn').addEventListener('click', async () => {
  const nome = $('nome').value.trim(), matricula = $('mat').value.trim();
  if (!nome || !matricula) return msg('err', 'Preencha nome e matrícula.');
  const btn = $('btn'); btn.disabled = true;
  try {
    msg('info', 'Obtendo sua localização…');
    const p = await getPos();
    msg('info', 'Enviando registro…');
    const r = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({
        nome, matricula, codigo: $('codigo').value,
        lat: p.coords.latitude, lng: p.coords.longitude, precisao: p.coords.accuracy,
        device: deviceId(), ua: navigator.userAgent
      })
    });
    const d = await r.json();
    if (d.ok) msg('ok', '<strong>Presença registrada</strong>' + esc(d.nome) + ' — ' + new Date().toLocaleTimeString('pt-BR'));
    else msg('err', '<strong>Registro recusado</strong>' + esc(d.motivo));
  } catch (e) {
    msg('err', '<strong>Registro não concluído</strong>' + esc(e.message));
  } finally { btn.disabled = false; }
});

init();
</script>
</body>
</html>
